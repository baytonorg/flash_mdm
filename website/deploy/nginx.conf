server {
    listen 8080 default_server;
    server_name _;

    root /var/www/flash-mdm;
    index index.html;

    location /_assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
